name: Add your map to EarthCiv
description: List a map you built on the world map at earthciv.org, or correct or remove its listing.
title: "Map: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for building a map. The [world map](https://earthciv.org/) at earthciv.org lists the maps made in the style of usaciv, each with its author's name and picture and, where its code is on GitHub, a link to its repository. It only points to your map: your code and data stay in your repository, under your licence.

        Look for your map there first, because it may already be listed. The search box at the top of the world map finds a map by its name, its author or its repository's name (`owner/name`, not the full address). The world map's own "Add its link" saves a link in your browser only: this form is what lists a map for everyone.

        To add a map, give its repository or its live address, and the places it covers. To correct or remove a listing, fill in the first two fields and whatever should change.

        If you would rather send a pull request, the list is [`web/data/ports.json`](https://github.com/earthciv/earthciv/blob/main/web/data/ports.json), and the [README](https://github.com/earthciv/earthciv#add-your-map) describes its fields.
  - type: dropdown
    id: request
    attributes:
      label: What should happen?
      options:
        - Add my map
        - Correct my map's listing
        - Remove my map
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Map name
      description: The name EarthCiv should show. For a correction or a removal, the name the map is listed under now.
      placeholder: Portugal (ptciv)
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository
      description: The map's repository on GitHub, if it has one. The list can link only to GitHub, so a map whose code is elsewhere needs a live address to be listed.
      placeholder: https://github.com/your-name/ptciv
  - type: input
    id: url
    attributes:
      label: Live address
      description: The public https address where the map runs. Leave this empty if the map runs only from its source code. It is then listed with a link to its GitHub repository.
      placeholder: https://your-name.github.io/ptciv/
  - type: markdown
    attributes:
      value: |
        **A map with a live address opens inside EarthCiv.** Visitors who pick it stay on earthciv.org: your map opens under a bar that names it and you and links to your site, and from there they can rate it, open another map or go back to the world map. A map that opens in a new tab takes them away from all of that and makes for a poorer visit, so EarthCiv lists a live map only when it can open inside.

        Most hosts allow this as they are, GitHub Pages and Cloudflare Pages among them. If your site sends `X-Frame-Options`, drop it and allow earthciv.org instead, for example with `Content-Security-Policy: frame-ancestors 'self' https://earthciv.org`. If it already sends `frame-ancestors`, add `https://earthciv.org` to it.

        If your map runs on EarthCiv's own code, send your country as an [edition](https://github.com/earthciv/earthciv/blob/main/docs/EDITIONS.md) instead: in a frame it would show its own map bar under EarthCiv's.
  - type: input
    id: places
    attributes:
      label: Places it covers
      description: The countries or territories on the map, by name or ISO code. For a map of one region or city, give its name and its country.
      placeholder: Portugal
  - type: input
    id: languages
    attributes:
      label: Languages
      description: The languages the map's own text is in.
      placeholder: Portuguese, English
  - type: textarea
    id: description
    attributes:
      label: One-sentence description
      description: What the map shows and where its data comes from, in plain text. English is easiest for the list, and any language is fine.
      placeholder: Portugal as a hex strategy map, built from INE and Eurostat open data.
  - type: input
    id: license
    attributes:
      label: Licence
      description: The licence your repository states, such as MIT. Leave this empty if it states none.
      placeholder: MIT
  - type: input
    id: twitter
    attributes:
      label: Your Twitter / X handle
      description: Optional. We link this beside your creator credit. To add or change it for an existing map, select "Correct my map's listing" above.
      placeholder: "@yourhandle"
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        For a correction, say what is wrong. EarthCiv credits you by your GitHub name, with your profile picture and
        a link to your profile. This is the place to ask for another name, for a link to a page of your own, or for
        your name alone without the picture.
