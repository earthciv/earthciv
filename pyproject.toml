[project]
name = "usaciv"
version = "0.1.0"
description = "A Civilization-style visualizer of the real United States"
requires-python = ">=3.11"
dependencies = []  # standard library only, on purpose

# Building an edition's data (python -m pipeline.canada) may use these, pinned to the versions that produced the
# committed data. Serving, checking and the tests stay standard library only.
[dependency-groups]
build = ["numpy==2.4.6", "pillow==13.0.0", "pyproj==3.7.2", "shapely==2.2.0"]
# Headless browser support for the test harness and packaging social cards.
harness = ["pillow==13.0.0", "playwright==1.65.2"]

[tool.uv]
package = false
